<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEBFA"/><stop offset=".6" stop-color="#EDF4FC"/><stop offset="1" stop-color="#F7FBFE"/>
    </linearGradient>
    <radialGradient id="pGlow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".9"/><stop offset="1" stop-color="#FFF9EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pIsle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBDDF6"/><stop offset=".55" stop-color="#93C5EC"/><stop offset="1" stop-color="#79B2E1"/>
    </linearGradient>
    <linearGradient id="pTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF5FC"/><stop offset="1" stop-color="#D5EAF8"/>
    </linearGradient>
    <linearGradient id="pGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E3A6"/><stop offset=".5" stop-color="#EFC86B"/><stop offset="1" stop-color="#E3B454"/>
    </linearGradient>
    <linearGradient id="pPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FADDE9"/><stop offset="1" stop-color="#F2B9CF"/>
    </linearGradient>
    <linearGradient id="pLav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7DEF6"/><stop offset="1" stop-color="#CDBBE8"/>
    </linearGradient>
    <filter id="pSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="550" height="300" fill="url(#pSky)"/>
  <ellipse cx="275" cy="128" rx="240" ry="128" fill="url(#pGlow)"/>

  <!-- sparkles -->
  <g fill="#F0C95E" opacity=".85">
    <path d="M96 70l2.4 7 7 2.4-7 2.4-2.4 7-2.4-7-7-2.4 7-2.4z"/>
    <path d="M470 92l1.8 5.4 5.4 1.8-5.4 1.8-1.8 5.4-1.8-5.4-5.4-1.8 5.4-1.8z"/>
    <circle cx="150" cy="130" r="2.4"/><circle cx="420" cy="150" r="2"/><circle cx="60" cy="150" r="2"/>
  </g>
  <g fill="#F2B9CF" opacity=".7"><circle cx="120" cy="98" r="2.6"/><circle cx="438" cy="66" r="2.4"/></g>

  <!-- island shadow -->
  <ellipse cx="270" cy="252" rx="150" ry="16" fill="#BFD9EE" opacity=".55" filter="url(#pSoft)"/>

  <!-- satin island -->
  <path d="M270 180c-64 0-118 12-118 30 0 8 10 15 28 19 6 22 46 34 90 34s84-12 90-34c18-4 28-11 28-19 0-18-54-30-118-30z" fill="url(#pIsle)"/>
  <path d="M152 208c0 9 20 16 48 19 26 3 68 3 94.5.6 30-2.6 75.5-8.6 75.5-19.6" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="270" cy="182" rx="118" ry="24" fill="url(#pTop)"/>

  <!-- open chest -->
  <g>
    <path d="M250 176h40v22a4 4 0 01-4 4h-32a4 4 0 01-4-4z" fill="url(#pPink)" stroke="#E3A8C2" stroke-width="2"/>
    <path d="M246 176c0-10 10-16 24-16s24 6 24 16v4h-48z" fill="url(#pLav)" stroke="#B9A3DC" stroke-width="2"/>
    <rect x="265" y="178" width="10" height="8" rx="2" fill="url(#pGold)"/>
    <path d="M270 186v10" stroke="#D8A93F" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- golden key floating -->
  <g transform="translate(270 116) rotate(-18)">
    <circle cx="-16" cy="0" r="11" fill="none" stroke="url(#pGold)" stroke-width="6"/>
    <circle cx="-16" cy="0" r="4.4" fill="#FFF3D6"/>
    <rect x="-6" y="-3.4" width="42" height="6.8" rx="3.4" fill="url(#pGold)"/>
    <path d="M28 3.4v8m8-8v5.5" stroke="url(#pGold)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-16" cy="-4" rx="3" ry="1.6" fill="#FFF" opacity=".8"/>
  </g>
  <ellipse cx="270" cy="146" rx="30" ry="5" fill="#F0C95E" opacity=".28" filter="url(#pSoft)"/>

  <!-- keepsakes with ribbons -->
  <g transform="translate(196 152)">
    <path d="M0-8c-8-14 8-24 16-14 6-8 20-2 18 10" fill="none" stroke="#E79FBD" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 2c3-12 19-12 22 0l4 12H-12z" fill="url(#pPink)" stroke="#E3A8C2" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="-14" y="12" width="34" height="6" rx="3" fill="#F6D3E2" stroke="#E3A8C2" stroke-width="2"/>
  </g>
  <g transform="translate(344 154)">
    <path d="M0-6c6-14 22-16 26-4" fill="none" stroke="#A8C9EC" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 4c4-4 10-4.6 14-2v22c-4-2.6-10-2-14 2-4-4-10-4.6-14-2V2c4-2.6 10-2 14 2 4-3.4 8.6-3.4 12 0z" transform="translate(12 0) scale(.9)" fill="url(#pLav)" stroke="#B9A3DC" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <g transform="translate(306 128) scale(.8)">
    <path d="M-10 0a10 10 0 0020 0" fill="url(#pPink)" stroke="#E3A8C2" stroke-width="2.6"/>
    <circle cx="12" cy="-2" r="3.4" fill="none" stroke="#E3A8C2" stroke-width="2.2"/>
    <rect x="-12" y="9" width="24" height="3.6" rx="1.8" fill="#F6D3E2"/>
    <path d="M-2-18c3-4 7-4 8 0" fill="none" stroke="#E79FBD" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
